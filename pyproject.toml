[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-watch"
version = "0.1.0"
description = "Tested data pipeline over Philippine government procurement awards"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
